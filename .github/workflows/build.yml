name: Build README and deploy Datasette

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/mabdullahabid1/til
  HAS_AZURE_OPENAI: ${{ secrets.AZURE_OPENAI_API_KEY != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
      # We need full history to introspect created/updated:
      with:
        fetch-depth: 0
        path: main
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/cache@v4
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-browsers
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r main/requirements.txt
    - name: Install Playwright dependencies
      run: |
        shot-scraper install
    - name: Download previous database unless REBUILD in commit message
      if: |-
        !contains(github.event.head_commit.message, 'REBUILD')
      # The live site serves its own database, which keeps embeddings,
      # similarities and screenshot hashes from earlier runs
      run: curl --fail -o main/tils.db https://til.abd.dev/tils.db
      continue-on-error: true
    - name: Build database
      env:
        MARKDOWN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        cd main
        python build_database.py
    - name: Soundness check
      run: |-
        cd main
        datasette . --get / | grep "Abdullah Abid: TIL"
        # A TIL page exercises the template plugins too
        page=$(sqlite-utils tils.db "select topic || '/' || slug as p from til limit 1" --raw | head -1)
        datasette . --get "/$page" | grep -q '<h1>'
    - name: Generate missing screenshots
      # Reuses screenshots the live site already serves from /shots/ and
      # only renders new or changed TILs
      run: |-
        cd main
        python generate_screenshots.py
    - name: Vacuum database
      run: sqlite-utils vacuum main/tils.db
    - name: Calculate embeddings and document similarity
      if: env.HAS_AZURE_OPENAI == 'true'
      # Related TILs should not block publishing when the embedding
      # provider is unavailable.
      continue-on-error: true
      env:
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
      run: |-
        cd main
        python build_embeddings.py
    - name: Update README
      run: |-
        cd main
        python update_readme.py --rewrite
        cat README.md
    - name: Commit and push if README changed
      run: |-
        cd main
        git diff
        git config --global user.email "actions@users.noreply.github.com"
        git config --global user.name "README-bot"
        git diff --quiet || (git add README.md && git commit -m "Updated README")
        git push
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Datasette image
      uses: docker/build-push-action@v6
      with:
        context: main
        push: true
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Deploy on Coolify
      env:
        COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      run: |-
        curl --fail-with-body -sS \
          -H "Authorization: Bearer $COOLIFY_TOKEN" \
          "https://cfy0.abd.dev/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false"
