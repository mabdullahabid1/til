name: Build README and deploy Datasette

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/mabdullahabid1/til
  HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
  HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
      # We need full history to introspect created/updated:
      with:
        fetch-depth: 0
        path: main
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/cache@v4
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache Playwright browsers
      if: env.HAS_AWS == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-browsers
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r main/requirements.txt
    - name: Install Playwright dependencies
      if: env.HAS_AWS == 'true'
      run: |
        shot-scraper install
    - name: Download previous database unless REBUILD in commit message
      if: |-
        !contains(github.event.head_commit.message, 'REBUILD')
      # The live site serves its own database, which keeps embeddings,
      # similarities and screenshot hashes from earlier runs
      run: curl --fail -o main/tils.db https://til.abd.dev/tils.db
      continue-on-error: true
    - name: Build database
      env:
        MARKDOWN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        cd main
        python build_database.py
    - name: Soundness check
      run: |-
        cd main
        datasette . --get / | grep "Abdullah Abid: TIL"
    - name: Generate missing screenshots
      if: env.HAS_AWS == 'true'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |-
        cd main
        python generate_screenshots.py
    - name: Vacuum database
      run: sqlite-utils vacuum main/tils.db
    - name: Calculate embeddings and document similarity
      if: env.HAS_OPENAI == 'true'
      # Search enrichment should not block publishing when the external
      # embedding provider is unavailable.
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |-
        cd main
        # Fetch embeddings for documents that need them
        openai-to-sqlite embeddings tils.db \
          --sql 'select path, title, topic, body from til'
        # Now calculate and save similarities
        if sqlite-utils rows tils.db similarities --limit 1; then
          # Table exists already, so only calculate new similarities
          openai-to-sqlite similar tils.db \
            $(git diff --name-only HEAD~10 HEAD | grep '/.*\.md$' | sed 's/\//_/g') \
            --save --recalculate-for-matches --print
        else
          # Table does not exist, calculate for everything
          openai-to-sqlite similar tils.db --all --save
        fi
    - name: Update README
      run: |-
        cd main
        python update_readme.py --rewrite
        cat README.md
    - name: Commit and push if README changed
      run: |-
        cd main
        git diff
        git config --global user.email "actions@users.noreply.github.com"
        git config --global user.name "README-bot"
        git diff --quiet || (git add README.md && git commit -m "Updated README")
        git push
    - name: Upload latest tils.db to the S3 bucket
      if: env.HAS_AWS == 'true'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |-
        s3-credentials put-object til.abd.dev tils.db main/tils.db
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Datasette image
      uses: docker/build-push-action@v6
      with:
        context: main
        push: true
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Deploy on Coolify
      env:
        COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      run: |-
        curl --fail-with-body -sS \
          -H "Authorization: Bearer $COOLIFY_TOKEN" \
          "https://cfy0.abd.dev/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false"
